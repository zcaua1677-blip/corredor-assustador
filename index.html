<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CORREDOR V7</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{margin:0;background:#000;overflow:hidden;touch-action:none;font-family:Arial} canvas{display:block!important}
#menu{position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center}
.card{width:88%;max-width:340px;background:#111;border:1px solid #333;padding:22px;border-radius:14px;text-align:center;color:#fff}
.btn{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-weight:bold}
.btnMP{background:#00ff88;color:#000;border:none}
#mpArea{display:none;margin-top:10px;background:#000;border:2px solid #00ff88;padding:12px;border-radius:12px}
input{width:92%;padding:10px;background:#111;color:#fff;border:1px solid #333;border-radius:8px;margin:6px 0}
#hud{position:fixed;top:0;left:0;right:0;padding:7px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;display:none;justify-content:space-between;z-index:10}
#joy{position:fixed;left:10px;bottom:12px;width:95px;height:95px;background:rgba(255,255,255,.08);border-radius:50%;z-index:20;display:none;border:1px solid #333}
#stick{position:absolute;left:50%;top:50%;width:42px;height:42px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
#look{position:fixed;right:0;top:0;width:50%;height:100%;z-index:15;display:none}
#walkBtn{position:fixed;right:15px;bottom:15px;width:85px;height:85px;background:rgba(0,255,136,.25);border:2px solid #00ff88;border-radius:50%;z-index:21;display:none;align-items:center;justify-content:center;color:#00ff88;font-weight:bold;font-size:26px}
#jumpScare{position:fixed;inset:0;background:#a00;display:none;z-index:1000;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:bold}
</style>
</head>
<body>
<div id="menu"><div class="card">
<h3 style="letter-spacing:5px">CORREDOR V7</h3><p style="font-size:10px;color:#666">MONSTROS + BOTAO ANDAR</p>
<button class="btn" onclick="go(false)">▶ OFF-LINE</button>
<button class="btn btnMP" onclick="abrirMP()">🌐 MULTIPLAYER</button>
<div id="mpArea"><div id="myId" style="color:#0f8">Gerando ID...</div><input id="fid" placeholder="ID do amigo"><button class="btn btnMP" onclick="entrar()">ENTRAR</button><button class="btn" onclick="criar()">CRIAR SALA</button></div>
</div></div>
<div id="hud"><span id="stat"></span><span id="dist">👹 --</span></div>
<div id="look"></div><div id="joy"><div id="stick"></div></div>
<div id="walkBtn">👟</div><div id="jumpScare">PEG0U!</div>
<script>
let scene,camera,renderer,player,yaw=0,pitch=0,move={x:0,y:0},others={},peer=null,conn=null,started=false,monsters=[],walking=false;
function abrirMP(){document.getElementById('mpArea').style.display='block'; if(!peer) gerarId();}
function gerarId(){document.getElementById('myId').textContent='Gerando...'; peer=new Peer(); peer.on('open',id=>{document.getElementById('myId').innerHTML='SEU ID:<br><b style=color:#fff>'+id+'</b>'}); peer.on('connection',c=>{conn=c; c.on('data',d=>{if(!others[c.peer]) addOther(c.peer); others[c.peer].position.set(d.x,d.y,d.z); others[c.peer].rotation.y=d.yaw;})});}
function criar(){go(true);} function entrar(){let f=document.getElementById('fid').value.trim(); if(!f) return alert('ID'); conn=peer.connect(f); conn.on('open',()=>go(true)); conn.on('data',d=>{if(!others[conn.peer]) addOther(conn.peer); others[conn.peer].position.set(d.x,d.y,d.z); others[conn.peer].rotation.y=d.yaw;});}
function go(m){if(started) return; started=true; document.getElementById('menu').style.display='none'; document.getElementById('hud').style.display='flex'; document.getElementById('joy').style.display='block'; document.getElementById('look').style.display='block'; document.getElementById('walkBtn').style.display='flex'; document.querySelectorAll('canvas').forEach(c=>c.remove()); init();}
function init(){scene=new THREE.Scene(); scene.background=new THREE.Color(0x000000); scene.fog=new THREE.Fog(0x000000,2,14); camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000); renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement); scene.add(new THREE.AmbientLight(0xffffff,0.6)); let floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshStandardMaterial({color:0x111})); floor.rotation.x=-Math.PI/2; scene.add(floor); for(let i=0;i<25;i++){let z=-Math.random()*60; let x=(Math.random()-0.5)*10; if(Math.abs(x)<2.5) continue; let b=new THREE.Mesh(new THREE.BoxGeometry(1,3,2), new THREE.MeshStandardMaterial({color:0x333})); b.position.set(x,1.5,z); scene.add(b);} player=new THREE.Group(); player.position.set(0,1.6,5); scene.add(player); player.add(camera); let hand=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.06,0.2), new THREE.MeshStandardMaterial({color:0xE8C4A0})); hand.position.set(0.2,-0.25,-0.5); camera.add(hand); let flash=new THREE.SpotLight(0xffffff,10,30,0.5); hand.add(flash); flash.position.set(0,0,0.1); flash.target.position.set(0,0,-10); hand.add(flash.target); for(let i=0;i<2;i++){ let g=new THREE.Group(); let bd=new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.7,4,8), new THREE.MeshStandardMaterial({color:0xf00})); g.add(bd); g.position.set((Math.random()-0.5)*6,0,-10-Math.random()*20); scene.add(g); monsters.push(g);} loop();}
function loop(){requestAnimationFrame(loop); let sp=0.07; if(walking) move.y=-1; let f=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion); let r=new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion); player.position.addScaledVector(f,-move.y*sp); player.position.addScaledVector(r,move.x*sp); player.rotation.y=yaw; camera.rotation.x=pitch; let md=99; monsters.forEach(m=>{ let dir=new THREE.Vector3().subVectors(player.position,m.position); let d=dir.length(); md=Math.min(md,d); dir.normalize(); m.position.addScaledVector(dir,0.02); m.lookAt(player.position); if(d<1.1){ document.getElementById('jumpScare').style.display='flex'; setTimeout(()=>location.reload(),1200);} }); document.getElementById('dist').textContent='👹 '+Math.floor(md)+'m'; renderer.render(scene,camera); if(conn&&conn.open) conn.send({x:player.position.x,y:player.position.y,z:player.position.z,yaw:yaw});}
function addOther(id){ let g=new THREE.Group(); let b=new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.8,4,8), new THREE.MeshStandardMaterial({color:0x00ff88})); g.add(b); g.position.set(1,0,5); scene.add(g); others[id]=g; }
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),ac=false,ox=0,oy=0; joy.addEventListener('touchstart',e=>{ac=true; ox=e.touches[0].clientX; oy=e.touches[0].clientY;},{passive:false}); joy.addEventListener('touchmove',e=>{if(!ac)return; let dx=Math.max(-35,Math.min(35,e.touches[0].clientX-ox)), dy=Math.max(-35,Math.min(35,e.touches[0].clientY-oy)); stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; move.x=dx/35; if(!walking) move.y=dy/35; e.preventDefault();},{passive:false}); joy.addEventListener('touchend',()=>{ac=false; stick.style.transform='translate(-50%,-50%)'; move.x=0; if(!walking) move.y=0;}); let look=document.getElementById('look'),la=false,lx=0,ly=0; look.addEventListener('touchstart',e=>{la=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY;}); look.addEventListener('touchmove',e=>{if(!la)return; yaw-=(e.touches[0].clientX-lx)*0.005; pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.touches[0].clientY-ly)*0.005)); lx=e.touches[0].clientX; ly=e.touches[0].clientY; e.preventDefault();},{passive:false}); look.addEventListener('touchend',()=>la=false); let wBtn=document.getElementById('walkBtn'); wBtn.addEventListener('touchstart',e=>{walking=true; e.preventDefault();},{passive:false}); wBtn.addEventListener('touchend',()=>{walking=false; move.y=0;});
</script></body></html>
